<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- background card (keeps the figure readable in GitHub dark mode) -->
  <rect x="0" y="0" width="980" height="520" rx="14" fill="#ffffff"/>

  <!-- column headers -->
  <g font-size="12" font-weight="600" fill="#57606a" letter-spacing="0.06em">
    <text x="145" y="30" text-anchor="middle">DATA SOURCES</text>
    <text x="455" y="30" text-anchor="middle">PROCESSING</text>
    <text x="790" y="30" text-anchor="middle">OUTPUT</text>
  </g>

  <!-- row 1: KDE4 -->
  <g>
    <rect x="30" y="45" width="230" height="58" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="145" y="70" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">KDE4 de–hsb</text>
    <text x="145" y="89" text-anchor="middle" font-size="12" fill="#57606a">OPUS · 20k pairs</text>

    <rect x="330" y="45" width="250" height="58" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="455" y="70" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Split + rule-based cleaning</text>
    <text x="455" y="89" text-anchor="middle" font-size="12" fill="#57606a">dedup · length ratio · untranslated</text>

    <rect x="650" y="45" width="280" height="58" rx="8" fill="#fff8f0" stroke="#d4a72c"/>
    <text x="790" y="70" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Leakage check</text>
    <text x="790" y="89" text-anchor="middle" font-size="12" fill="#57606a">129 train–test overlaps → dedup test sets</text>
  </g>

  <!-- row 2: WMT22 (Pipeline 1) -->
  <g>
    <rect x="30" y="125" width="230" height="58" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="145" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">WMT22 de–hsb</text>
    <text x="145" y="169" text-anchor="middle" font-size="12" fill="#57606a">451k pairs</text>

    <rect x="330" y="125" width="250" height="58" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="455" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Rebuild + GlotLID filter</text>
    <text x="455" y="169" text-anchor="middle" font-size="12" fill="#57606a">language-ID → 116k clean pairs</text>

    <rect x="650" y="125" width="280" height="58" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="790" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Pipeline 1 · true parallel</text>
    <text x="790" y="169" text-anchor="middle" font-size="12" fill="#57606a">KDE4 train + 100k WMT22 pairs</text>
  </g>

  <!-- row 3: OPUS pivot (Pipeline 2) -->
  <g>
    <rect x="30" y="205" width="230" height="58" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="145" y="230" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">OPUS cs / en / pl–hsb</text>
    <text x="145" y="249" text-anchor="middle" font-size="12" fill="#57606a">non-German parallel data</text>

    <rect x="330" y="205" width="250" height="58" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="455" y="230" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Translate X → de with NLLB</text>
    <text x="455" y="249" text-anchor="middle" font-size="12" fill="#57606a">pivot machine translation</text>

    <rect x="650" y="205" width="280" height="58" rx="8" fill="#fff1e5" stroke="#fb8f44"/>
    <text x="790" y="230" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Pipeline 2 · pivot-MT</text>
    <text x="790" y="249" text-anchor="middle" font-size="12" fill="#57606a">KDE4 train + synthetic de–hsb pairs</text>
  </g>

  <!-- horizontal arrows -->
  <g stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="262" y1="74" x2="326" y2="74"/>
    <line x1="582" y1="74" x2="646" y2="74"/>
    <line x1="262" y1="154" x2="326" y2="154"/>
    <line x1="582" y1="154" x2="646" y2="154"/>
    <line x1="262" y1="234" x2="326" y2="234"/>
    <line x1="582" y1="234" x2="646" y2="234"/>
  </g>

  <!-- merge bus into training -->
  <g stroke="#57606a" stroke-width="1.6" fill="none">
    <polyline points="930,154 952,154 952,300 320,300"/>
    <line x1="930" y1="234" x2="952" y2="234"/>
  </g>
  <g stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="320" y1="300" x2="320" y2="326"/>
    <line x1="660" y1="300" x2="660" y2="326"/>
  </g>
  <text x="636" y="293" text-anchor="middle" font-size="12" fill="#57606a">training data (de→hsb and hsb→de)</text>

  <!-- models -->
  <g>
    <rect x="170" y="330" width="300" height="72" rx="10" fill="#f5f0ff" stroke="#8250df"/>
    <text x="320" y="358" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Extended NLLB-200 600M</text>
    <text x="320" y="379" text-anchor="middle" font-size="12" fill="#57606a">+ hsb_Latn token (init. from ces_Latn)</text>
    <text x="320" y="394" text-anchor="middle" font-size="12" fill="#57606a">full fine-tuning</text>

    <rect x="510" y="330" width="300" height="72" rx="10" fill="#f5f0ff" stroke="#8250df"/>
    <text x="660" y="358" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Qwen2.5-7B-Instruct</text>
    <text x="660" y="379" text-anchor="middle" font-size="12" fill="#57606a">LoRA (r=8, α=16)</text>
    <text x="660" y="394" text-anchor="middle" font-size="12" fill="#57606a">4-bit quantization</text>
  </g>

  <!-- to evaluation -->
  <g stroke="#57606a" stroke-width="1.6" fill="none">
    <polyline points="320,402 320,422 660,422 660,402"/>
  </g>
  <line x1="490" y1="422" x2="490" y2="440" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="300" y="444" width="380" height="56" rx="10" fill="#dafbe1" stroke="#4ac26b"/>
  <text x="490" y="468" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Evaluation: BLEU · chrF++ · xCOMET</text>
  <text x="490" y="487" text-anchor="middle" font-size="12" fill="#57606a">2,000-pair held-out test + leakage-controlled test sets</text>
</svg>
